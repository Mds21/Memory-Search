# One command: docker compose up --build   ->  UI http://localhost:3000, API http://localhost:8000/docs
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/smriti.db
      DATA_DIR: /data
      ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
    volumes:
      - smriti-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional: local LLM / VLM / embeddings. Start with `docker compose --profile ai up`,
  # then set TEXT_EMBEDDER=ollama:bge-m3, VLM=ollama:qwen2.5vl:3b, LLM=ollama:qwen2.5:3b and OLLAMA_BASE_URL=http://ollama:11434 in backend/.env
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  smriti-data:
  ollama:
